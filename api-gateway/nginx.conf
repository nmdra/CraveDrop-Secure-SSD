events {}

http {
    # Do not expose the Nginx version in headers or generated error pages.
    server_tokens off;

    # Apply browser-side response hardening to gateway and fallback responses.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Rate Limiting (5 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    upstream user_service {
        server user-service:3000;
    }

    upstream notification_service {
        server notification-service:3000;
    }

    upstream order_service {
        server order-service:5000;
    }

    upstream payment_service {
        server payment-service:5002;
    }

    upstream driver_service {
        server driver-service:3000;
    }

    upstream delivery_service {
        server delivery-service:3000;
    }

    server {
        listen 5000;
        server_name localhost;

        # User Service
        location /api/user/ {
            proxy_pass http://user_service;
            limit_req zone=api burst=10;

            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        }

        # Notification Service
        location /api/notify/ {
            proxy_pass http://notification_service;
            error_page 401 = /unauthorized;

            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        }

        # Order Service
        location /api/orders/ {
            proxy_pass http://order_service;
            limit_req zone=api burst=10;

            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        }

        # Payment Service
        location /api/payments/ {
            proxy_pass http://payment_service;
            limit_req zone=api burst=10;

            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        }

        # Payment Service
        location /api/delivery/ {
            rewrite ^/api/delivery/(.*)$ /delivery/$1 break;
            proxy_pass http://delivery_service/;
            limit_req zone=api burst=10;

            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        }

        # Payment Service
        location /api/driver/ {
            rewrite ^/api/driver/(.*)$ /driver/$1 break;
            proxy_pass http://driver_service/;
            limit_req zone=api burst=10;

            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        }

        location = /unauthorized {
            return 401;
        }
    }
}
